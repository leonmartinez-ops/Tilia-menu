<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f1e8">
<title>Tilia Café · Menú</title>
<style>
:root{
  --teal:#137f8f; --teal-dark:#0d5f6d; --ink:#183033; --cream:#f7f1e8; --paper:#fffdf8;
  --line:rgba(19,127,143,.17); --muted:#6f7979; --peach:#f4d9c7; --sage:#dce7d9; --rose:#f1d9d8;
}
*{box-sizing:border-box} html{scroll-behavior:smooth;background:var(--cream)}
body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit}
.page{width:100%;overflow:hidden}
.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:rgba(247,241,232,.90);backdrop-filter:blur(18px);border-bottom:1px solid rgba(19,127,143,.08)}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:58px;height:58px;object-fit:contain;border-radius:50%;background:#fff}.brand small{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--teal-dark);font-weight:800}
.quick{display:flex;gap:7px;overflow:auto;max-width:66vw;scrollbar-width:none}.quick::-webkit-scrollbar{display:none}.quick button{border:0;background:rgba(255,255,255,.8);color:var(--teal-dark);border-radius:999px;padding:10px 13px;font-size:11px;font-weight:750;white-space:nowrap;box-shadow:inset 0 0 0 1px var(--line)}.quick button.active{background:var(--teal);color:#fff;box-shadow:none}
.hero{height:100svh;min-height:620px;position:relative;overflow:hidden;background:#10282c;color:#fff}
.hero-slider{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;overscroll-behavior-x:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}.hero-slider::-webkit-scrollbar{display:none}
.hero-slide{position:relative;flex:0 0 100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always}.hero-slide img{width:100%;height:100%;display:block;object-fit:cover;object-position:center}
.hero-slide:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,24,27,.28) 0%,rgba(7,24,27,0) 38%,rgba(7,24,27,.12) 60%,rgba(7,24,27,.78) 100%);pointer-events:none}
.hero-overlay{position:absolute;z-index:3;inset:0;padding:max(24px,env(safe-area-inset-top)) clamp(20px,5vw,64px) max(34px,env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}.hero-logo{width:104px;height:104px;object-fit:contain;border-radius:50%;background:#fff;box-shadow:0 14px 44px rgba(0,0,0,.18)}
.hero-bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}.hero-copy{max-width:720px}.hero-kicker{font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}.hero h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(48px,8vw,92px);font-weight:400;line-height:.92;letter-spacing:-.045em;margin:10px 0 0;text-shadow:0 2px 24px rgba(0,0,0,.22)}.hero .hint{margin-top:18px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.hero-dots{display:flex;gap:8px;pointer-events:auto;padding-bottom:4px}.hero-dot{width:9px;height:9px;border:0;border-radius:50%;padding:0;background:rgba(255,255,255,.42)}.hero-dot.active{background:#fff;transform:scale(1.25)}
.featured{padding:18px 0 40px}.section-head{padding:0 clamp(18px,5vw,68px);max-width:1120px;margin:0 auto 18px}.eyebrow{font-size:10px;letter-spacing:.20em;text-transform:uppercase;color:var(--teal);font-weight:850}.section-head h2{font-family:Georgia,"Times New Roman",serif;font-size:clamp(36px,6vw,68px);font-weight:400;line-height:1;margin:7px 0 0;letter-spacing:-.035em}
.carousel{display:flex;gap:clamp(12px,2.5vw,28px);overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-left:clamp(18px,5vw,68px);padding:0 clamp(18px,5vw,68px) 18px;scrollbar-width:none}.carousel::-webkit-scrollbar{display:none}
.slide{flex:0 0 min(86vw,760px);height:min(78svh,760px);min-height:590px;scroll-snap-align:start;border-radius:42px;overflow:hidden;position:relative;background:var(--paper);box-shadow:0 24px 70px rgba(16,55,61,.12);border:1px solid rgba(19,127,143,.10)}
.slide[data-cat="Bebidas"]{background:linear-gradient(145deg,#f8e0d3 0%,#fff8f1 58%,#d7e7df 100%)}.slide[data-cat="Comida"]{background:linear-gradient(145deg,#f3eadc 0%,#fffaf1 58%,#dbe6e1 100%)}
.slide-copy{position:absolute;z-index:3;left:clamp(20px,4vw,40px);right:clamp(20px,4vw,40px);top:clamp(20px,4vw,38px)}
.slide .tag{display:inline-block;padding:8px 11px;border-radius:999px;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);color:var(--teal-dark);font-size:10px;font-weight:850;letter-spacing:.10em;text-transform:uppercase}
.slide h3{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(38px,6vw,68px);line-height:.93;letter-spacing:-.045em;margin:14px 0 0;max-width:580px}.slide .micro{font-size:12px;color:var(--muted);margin-top:10px}
.photo-stage{position:absolute;left:0;right:0;bottom:0;height:66%;display:flex;align-items:flex-end;justify-content:center;padding:16px 18px 0}.photo-stage:before{content:"";position:absolute;width:68%;aspect-ratio:1;border-radius:50%;background:rgba(19,127,143,.08);bottom:2%;right:3%}.photo-stage img{position:relative;z-index:2;width:100%;height:100%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 24px 30px rgba(18,50,55,.16))}
.peek{padding:6px clamp(18px,5vw,68px) 0;max-width:1120px;margin:0 auto;color:var(--teal-dark);font-size:11px;display:flex;align-items:center;gap:8px}.peek:before{content:"";width:26px;height:1px;background:var(--teal)}
.menu-section{padding:70px clamp(18px,5vw,68px);background:var(--paper)}.menu-wrap{max-width:1120px;margin:0 auto}.menu-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:26px}.menu-card{background:#fff;border:1px solid var(--line);border-radius:28px;overflow:hidden}.menu-card .imgbox{aspect-ratio:1.05/1;background:#f4eee6;display:flex;align-items:center;justify-content:center;padding:12px}.menu-card img{width:100%;height:100%;object-fit:contain}.menu-card .txt{padding:15px 16px 18px}.menu-card h4{font-family:Georgia,"Times New Roman",serif;font-size:clamp(20px,3vw,28px);font-weight:400;line-height:1.02;margin:0}.menu-card span{display:block;margin-top:8px;color:var(--teal);font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.footer{padding:60px 20px 100px;text-align:center;background:var(--teal);color:#fff}.footer img{width:126px;height:126px;object-fit:contain;border-radius:50%;background:#fff}.footer p{font-family:Georgia,"Times New Roman",serif;font-size:28px;line-height:1.08;margin:18px auto 0;max-width:420px}.footer small{display:block;margin-top:12px;opacity:.75}
.dock{position:fixed;z-index:80;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));width:min(calc(100% - 24px),520px);display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:7px;background:rgba(18,48,53,.92);backdrop-filter:blur(16px);border-radius:23px;box-shadow:0 16px 45px rgba(0,0,0,.18);transition:opacity .25s ease,transform .25s ease}.dock button{border:0;background:transparent;color:#dff0f2;padding:12px 7px;border-radius:16px;font-size:11px;font-weight:780}.dock button.active{background:#fff;color:var(--teal-dark)}body.hero-visible .dock{opacity:0;pointer-events:none;transform:translate(-50%,18px)}
@media (min-width:800px){.topbar{padding-left:40px;padding-right:40px}.menu-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.slide{flex-basis:min(68vw,760px)}}
@media (max-width:560px){.topbar{align-items:flex-start}.brand small{display:none}.brand img{width:52px;height:52px}.quick{max-width:74vw}.hero{min-height:100svh}.hero-overlay{padding-left:20px;padding-right:20px}.hero-logo{width:86px;height:86px}.hero-bottom{display:block}.hero h1{font-size:46px}.hero-dots{margin-top:22px}.slide{flex-basis:88vw;min-height:560px;height:72svh}.slide h3{font-size:42px}.photo-stage{height:64%}.menu-grid{gap:12px}.menu-card{border-radius:22px}.menu-card .txt{padding:12px}}
</style>
</head>
<body>
<div class="page">
  <section class="hero" id="inicio" aria-label="Galería de especiales Tilia">
    <div class="hero-slider" id="heroSlider"></div>
    <div class="hero-overlay">
      <img class="hero-logo" src="assets/tilia-logo.jpg" alt="Tilia Café">
      <div class="hero-bottom">
        <div class="hero-copy"><div class="hero-kicker">Menú visual</div><h1 id="heroTitle">Huevos con machaca</h1><div class="hint">Desliza para ver los especiales</div></div>
        <div class="hero-dots" id="heroDots" aria-label="Diapositivas"></div>
      </div>
    </div>
  </section>

  <header class="topbar">
    <div class="brand"><img src="assets/tilia-logo.jpg" alt="Tilia Café"><small>Menú digital</small></div>
    <nav class="quick" aria-label="Categorías">
      <button class="active" data-target="destacados">Destacados</button>
      <button data-target="comida">Comida</button>
      <button data-target="bebidas">Bebidas</button>
    </nav>
  </header>

  <section class="featured" id="destacados">
    <div class="section-head"><div class="eyebrow">Especiales</div><h2>Explora Tilia</h2></div>
    <div class="carousel" id="carousel"></div>
    <div class="peek">desliza lateralmente</div>
  </section>

  <section class="menu-section" id="comida"><div class="menu-wrap"><div class="eyebrow">Para comer</div><div class="section-head" style="padding:0;margin:0"><h2>Comida</h2></div><div class="menu-grid" id="food"></div></div></section>
  <section class="menu-section" id="bebidas" style="background:#f8f3eb"><div class="menu-wrap"><div class="eyebrow">Para tomar</div><div class="section-head" style="padding:0;margin:0"><h2>Bebidas</h2></div><div class="menu-grid" id="drinks"></div></div></section>

  <footer class="footer"><img src="assets/tilia-logo.jpg" alt="Tilia Café"><p>Menú visual de Tilia Café</p><small>Especiales disponibles en esta versión.</small></footer>
</div>
<nav class="dock"><button class="active" onclick="go('inicio',this)">Inicio</button><button onclick="go('destacados',this)">Explorar</button><button onclick="go('comida',this)">Menú</button></nav>
<script>
const products=[
 {name:'Huevos con machaca',cat:'Comida',img:'assets/huevos-machaca.jpg'},
 {name:'Quesadilla',cat:'Comida',img:'assets/quesadilla.jpg'},
 {name:'Chilaquiles verde',cat:'Comida',img:'assets/chilaquiles-verde.jpg'},
 {name:'Sándwich napolitano',cat:'Comida',img:'assets/sandwich-napolitano.jpg'},
 {name:'Horchata Tilia',cat:'Bebidas',img:'assets/horchata-tilia.jpg'},
 {name:'Jamaicada',cat:'Bebidas',img:'assets/jamaicada.jpg'}
];
const heroSlider=document.getElementById('heroSlider');
const heroDots=document.getElementById('heroDots');
const heroTitle=document.getElementById('heroTitle');
heroSlider.innerHTML=products.map((p,i)=>`<article class="hero-slide"><img src="${p.img}" alt="${p.name}" ${i===0?'fetchpriority="high"':'loading="eager"'}></article>`).join('');
heroDots.innerHTML=products.map((p,i)=>`<button class="hero-dot${i===0?' active':''}" type="button" aria-label="Ver ${p.name}" data-index="${i}"></button>`).join('');
let heroIndex=0;
let heroTimer;
let scrollTimer;
function showHero(index,scroll=true){heroIndex=(index+products.length)%products.length;if(scroll)heroSlider.scrollTo({left:heroSlider.clientWidth*heroIndex,behavior:'smooth'});heroTitle.textContent=products[heroIndex].name;document.querySelectorAll('.hero-dot').forEach((dot,i)=>dot.classList.toggle('active',i===heroIndex))}
function startHero(){clearInterval(heroTimer);heroTimer=setInterval(()=>showHero(heroIndex+1),4200)}
heroDots.addEventListener('click',event=>{const dot=event.target.closest('.hero-dot');if(!dot)return;showHero(Number(dot.dataset.index));startHero()});
heroSlider.addEventListener('scroll',()=>{clearTimeout(scrollTimer);scrollTimer=setTimeout(()=>showHero(Math.round(heroSlider.scrollLeft/heroSlider.clientWidth),false),100)},{passive:true});
heroSlider.addEventListener('pointerdown',()=>clearInterval(heroTimer),{passive:true});
heroSlider.addEventListener('pointerup',startHero,{passive:true});
document.addEventListener('visibilitychange',()=>document.hidden?clearInterval(heroTimer):startHero());
new IntersectionObserver(([entry])=>document.body.classList.toggle('hero-visible',entry.isIntersecting),{threshold:.55}).observe(document.getElementById('inicio'));
document.body.classList.add('hero-visible');
startHero();
const carousel=document.getElementById('carousel');
carousel.innerHTML=products.map(p=>`<article class="slide" data-cat="${p.cat}"><div class="slide-copy"><span class="tag">${p.cat}</span><h3>${p.name}</h3><div class="micro">Especial Tilia</div></div><div class="photo-stage"><img src="${p.img}" alt="${p.name}" loading="eager"></div></article>`).join('');
const card=p=>`<article class="menu-card"><div class="imgbox"><img src="${p.img}" alt="${p.name}" loading="lazy"></div><div class="txt"><h4>${p.name}</h4><span>${p.cat}</span></div></article>`;
document.getElementById('food').innerHTML=products.filter(p=>p.cat==='Comida').map(card).join('');
document.getElementById('drinks').innerHTML=products.filter(p=>p.cat==='Bebidas').map(card).join('');
document.querySelectorAll('.quick button').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.quick button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.getElementById(btn.dataset.target).scrollIntoView({behavior:'smooth'})}));
function go(id,btn){document.getElementById(id).scrollIntoView({behavior:'smooth'});document.querySelectorAll('.dock button').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}
</script>
</body>
</html>
